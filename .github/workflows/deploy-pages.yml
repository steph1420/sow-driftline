name: CI + Deploy Pages (/sow-driftline/)
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.v.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Stable site never ships a prerelease; 0.x.y-beta.n is served only by steph1420/sow-driftline-beta.
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          if echo "$V" | grep -q -- '-'; then echo "stable=false" >> "$GITHUB_OUTPUT"; else echo "stable=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.v.outputs.stable == 'true' && github.ref == 'refs/heads/master'
        with: { path: dist }
  deploy:
    needs: build
    if: needs.build.outputs.stable == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
